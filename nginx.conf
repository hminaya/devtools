server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # Set at server level so it is inherited by every location. A regex location
    # such as the .md block below outranks the "location /" prefix match, so a
    # header declared only inside "location /" would never reach markdown mirrors.
    add_header Link '</llms.txt>; rel="service-desc"; type="text/plain", </llms-full.txt>; rel="service-doc describedby"; type="text/plain", </privacy-policy>; rel="privacy-policy"; type="text/html", </terms-of-use>; rel="terms-of-service"; type="text/html"' always;

    location = /404.html {
        internal;
    }

    # Consolidate the retired duplicate stack-trace page into the canonical tool.
    location = /tools/beautify-stack-trace {
        return 301 /tools/stacktrace-formatter;
    }

    location = /tools/beautify-stack-trace/ {
        return 301 /tools/stacktrace-formatter;
    }

    location = /tools/beautify-stack-trace.md {
        return 301 /tools/stacktrace-formatter.md;
    }

    location ~ \.md$ {
        default_type "text/markdown; charset=utf-8";
    }

    # Handle clean URLs (no .html extension)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
